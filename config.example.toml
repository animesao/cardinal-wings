# cardinal-wings configuration
#
# Copy to /etc/cardinal-wings/config.toml and set at least one API key.
# Status: in development — schema may change.

[server]
host = "127.0.0.1"     # loopback by default; external binds need keys + TLS
port = 8080
# tls_cert = "/etc/cardinal-wings/server.crt"
# tls_key  = "/etc/cardinal-wings/server.key"

# Per-container SFTP (SSH). The panel assigns a username/password per server
# and users connect straight to the container data directory with any SFTP
# client (Filezilla, WinSCP, …). Sessions are jailed to the container data.
sftp_enabled = true
sftp_host = "0.0.0.0"    # bind SFTP on all interfaces so clients can reach it
sftp_port = 2022

# Panel credentials. role is "readonly" or "admin".
[[keys]]
name = "main"
key = "change-me"
role = "admin"

# Remote cluster nodes, reached through their `cardinal serve` API.
[[nodes]]
name = "node-1"
address = "http://10.0.0.2:2375"
token = "that-node-serve-token"
enabled = false

# Link back to the web panel (SFTP logins with panel passwords, backup
# completion callbacks). url is the panel base URL; token_id/token is the
# "tokenID.token" pair the panel shows for this node (Admin -> Nodes).
# When set, SFTP users unknown to the local store are verified via
# POST {url}/api/remote/sftp/auth, and backup snapshots are reported to
# POST {url}/api/remote/backups/{uuid}. The panel also pushes these values
# automatically on every node save (POST /v1/config).
# [panel]
# url = "https://panel.example.com"
# token_id = "abc123"
# token = "secrettoken"

[remote]
metrics_requires_auth = true
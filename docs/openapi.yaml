openapi: 3.0.3
info:
  title: cardinal-wings API
  description: >
    REST API daemon for managing cardinal over HTTP. Panel-oriented surface
    over cardinal's Docker-compatible API, with multi-node routing (`?node=`),
    async tasks, streaming logs/exec, metrics and role-based auth.
  version: "0.2.0-dev"
servers:
  - url: http://127.0.0.1:8080
security:
  - bearerAuth: []
tags:
  - name: system
  - name: containers
  - name: images
  - name: blueprints
  - name: tasks
  - name: services
  - name: functions
  - name: cluster
paths:
  /v1/ping:
    get:
      tags: [system]
      security: []
      summary: Liveness check
      responses:
        "200":
          description: pong
          content:
            text/plain:
              schema: { type: string }
  /v1/version:
    get:
      tags: [system]
      summary: Wings version
      responses:
        "200":
          description: Version info
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Version" }
  /v1/self:
    get:
      tags: [system]
      summary: Role of the current API key
      responses:
        "200":
          description: Auth introspection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Self" }
  /v1/nodes:
    get:
      tags: [cluster]
      summary: Cluster nodes with live health
      responses:
        "200":
          description: Node list
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items: { $ref: "#/components/schemas/Node" }
  /v1/system/info:
    get:
      tags: [system]
      summary: Dashboard aggregate per node
      responses:
        "200":
          description: Per-node summary and totals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemInfo" }
  /v1/metrics:
    get:
      tags: [system]
      summary: Prometheus metrics (admin only)
      responses:
        "200":
          description: Prometheus text format
          content:
            text/plain:
              schema: { type: string }
  /v1/events:
    get:
      tags: [system]
      summary: Container events as SSE stream
      responses:
        "200":
          description: text/event-stream of container events
  /healthz:
    get:
      tags: [system]
      security: []
      summary: Readiness probe, no auth
      responses:
        "200":
          description: ok, or 503 degraded without cardinal
  /v1/sftp/info:
    get:
      tags: [system]
      summary: SFTP listener status
      responses:
        "200":
          description: host, port and enabled flag
  /v1/bootstrap/ensure:
    post:
      tags: [system]
      summary: Install and start cardinal boot supervisor (admin)
      responses: { "200": { description: ensured } }
  /v1/containers:
    get:
      tags: [containers]
      summary: List containers
      parameters:
        - { name: all, in: query, schema: { type: boolean } }
        - { name: state, in: query, schema: { type: string, enum: [running, stopped] } }
        - { name: image, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [name, status, created_at] } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: limit, in: query, schema: { type: integer, default: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: node, in: query, schema: { type: string } }
      responses:
        "200":
          description: Container page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContainerPage" }
    post:
      tags: [containers]
      summary: Create a container (admin)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRequest" }
      responses:
        "201": { description: Created }
  /v1/containers/{id}:
    get:
      tags: [containers]
      summary: Inspect a container
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: node, in: query, schema: { type: string } }
      responses:
        "200": { description: Container detail }
    delete:
      tags: [containers]
      summary: Remove a container (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: force, in: query, schema: { type: boolean } }
      responses:
        "200": { description: Removed }
  /v1/containers/{id}/start:
    post:
      tags: [containers]
      summary: Start (admin)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: ok } }
  /v1/containers/{id}/stop:
    post:
      tags: [containers]
      summary: Stop (admin)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: ok } }
  /v1/containers/{id}/restart:
    post:
      tags: [containers]
      summary: Restart (admin)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: ok } }
  /v1/containers/{id}/kill:
    post:
      tags: [containers]
      summary: Kill (admin)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: ok } }
  /v1/containers/{id}/stats:
    get:
      tags: [containers]
      summary: Stats (?stream=1 → live SSE)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: stream, in: query, schema: { type: boolean } }
        - { name: interval, in: query, schema: { type: string } }
      responses: { "200": { description: Docker stats schema or SSE stream } }
  /v1/containers/{id}/logs:
    get:
      tags: [containers]
      summary: Logs (tail; follow=1 → SSE)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: tail, in: query, schema: { type: string } }
        - { name: follow, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Log text or SSE stream
  /v1/containers/{id}/exec:
    post:
      tags: [containers]
      summary: Run a command (admin)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExecRequest" }
      responses: { "200": { description: exec id } }
  /v1/containers/{id}/exec/stream:
    post:
      tags: [containers]
      summary: Run a command and stream output as SSE (admin)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExecRequest" }
      responses: { "200": { description: SSE stream } }
  /v1/containers/{id}/terminal:
    post:
      tags: [containers]
      summary: Open an interactive shell session (admin)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: session opened } }
  /v1/containers/{id}/terminal/input:
    post:
      tags: [containers]
      summary: Write to the terminal session stdin (admin)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data: { type: string }
      responses: { "200": { description: ok } }
  /v1/containers/{id}/terminal/stream:
    get:
      tags: [containers]
      summary: Read the terminal session output (SSE)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: SSE stream } }
  /v1/containers/{id}/terminal/ws:
    get:
      tags: [containers]
      summary: Terminal session over websocket (admin)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: websocket stream } }
  /v1/containers/{id}/fs/ls:
    get:
      tags: [containers]
      summary: List files inside the container
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: path, in: query, schema: { type: string } }
      responses: { "200": { description: file list } }
  /v1/containers/{id}/fs/cat:
    get:
      tags: [containers]
      summary: Show a file inside the container
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: path, in: query, schema: { type: string } }
      responses: { "200": { description: file content } }
  /v1/containers/{id}/fs/tree:
    get:
      tags: [containers]
      summary: Directory tree inside the container
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: path, in: query, schema: { type: string } }
      responses: { "200": { description: tree } }
  /v1/containers/{id}/fm/list:
    get:
      tags: [containers]
      summary: File manager list (admin reads allowed)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: path, in: query, schema: { type: string } }
      responses: { "200": { description: entries } }
  /v1/containers/{id}/fm/read:
    get:
      tags: [containers]
      summary: File manager read file
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: path, in: query, schema: { type: string } }
      responses: { "200": { description: content } }
  /v1/containers/{id}/fm/download:
    get:
      tags: [containers]
      summary: File manager download file (base64)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: path, in: query, schema: { type: string } }
      responses: { "200": { description: base64 content } }
  /v1/containers/{id}/fm/write:
    post:
      tags: [containers]
      summary: File manager write/upload file, base64 content (admin)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                path: { type: string }
                content: { type: string }
      responses: { "200": { description: written } }
  /v1/containers/{id}/fm/mkdir:
    post:
      tags: [containers]
      summary: File manager create directory (admin)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: created } }
  /v1/containers/{id}/fm/rm:
    post:
      tags: [containers]
      summary: File manager remove file or directory (admin)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: removed } }
  /v1/containers/{id}/fm/move:
    post:
      tags: [containers]
      summary: File manager move/rename (admin)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                src: { type: string }
                dst: { type: string }
      responses: { "200": { description: moved } }
  /v1/containers/{id}/fm/chmod:
    post:
      tags: [containers]
      summary: File manager chmod (admin)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: chmodded } }
  /v1/containers/{id}/backup:
    get:
      tags: [containers]
      summary: Download container data as tar.gz
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: tar.gz archive } }
    post:
      tags: [containers]
      summary: Restore container data from tar.gz, ?clean=1 for exact restore (admin)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: restored } }
  /v1/containers/{id}/cp:
    post:
      tags: [containers]
      summary: Copy files host<->container via cardinal cp (admin)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [src, dst]
              properties:
                src: { type: string }
                dst: { type: string }
      responses: { "200": { description: copied } }
  /v1/containers/{id}/limits:
    post:
      tags: [containers]
      summary: Change memory/CPU/disk limits in place (admin)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                memory_bytes: { type: integer }
                cpus: { type: number }
                disk_bytes: { type: integer }
      responses: { "200": { description: updated } }
  /v1/containers/{id}/update:
    post:
      tags: [containers]
      summary: Update startup script/env/resources, applied on restart (admin)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: updated } }
  /v1/containers/{id}/sftp:
    get:
      tags: [containers]
      summary: SFTP credential status for a container
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: status } }
    put:
      tags: [containers]
      summary: Set SFTP credential for a container (admin)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                password: { type: string }
      responses: { "200": { description: set } }
    delete:
      tags: [containers]
      summary: Remove SFTP credential (admin)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: removed } }
  /v1/images:
    get:
      tags: [images]
      summary: List images
      responses:
        "200":
          description: Image list
          content:
            application/json:
              schema:
                type: object
                properties:
                  images: { type: array }
  /v1/images/search:
    get:
      tags: [images]
      summary: Search Docker Hub
      parameters: [{ name: q, in: query, required: true, schema: { type: string } }]
      responses: { "200": { description: search results } }
  /v1/images/{ref}:
    get:
      tags: [images]
      summary: Inspect an image
      parameters: [{ name: ref, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: image detail } }
    delete:
      tags: [images]
      summary: Remove an image (admin)
      parameters: [{ name: ref, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: removed } }
  /v1/images/{ref}/pull:
    post:
      tags: [images]
      summary: Pull an image (admin, async task)
      parameters: [{ name: ref, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                image: { type: string }
                platform: { type: string }
      responses:
        "202":
          description: Accepted, returns task_id
  /v1/images/{ref}/tag:
    post:
      tags: [images]
      summary: Tag an image (admin)
      parameters:
        - { name: ref, in: path, required: true, schema: { type: string } }
        - { name: repo, in: query, required: true, schema: { type: string } }
        - { name: tag, in: query, schema: { type: string } }
      responses: { "200": { description: tagged } }
  /v1/images/{ref}/push:
    post:
      tags: [images]
      summary: Push an image (admin)
      parameters: [{ name: ref, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: pushed } }
  /v1/blueprints:
    get:
      tags: [blueprints]
      summary: Blueprint catalog
      responses:
        "200":
          description: Catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  blueprints: { type: array }
  /v1/blueprints/{name}:
    get:
      tags: [blueprints]
      summary: Blueprint detail with template
      parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: blueprint + template } }
  /v1/blueprints/{name}/install:
    post:
      tags: [blueprints]
      summary: Install (admin, async task)
      parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                memory: { type: string }
                cpus: { type: string }
                env: { type: array, items: { type: string } }
                yes: { type: boolean }
      responses:
        "202":
          description: Accepted, returns task_id
  /v1/blueprints/{name}/uninstall:
    post:
      tags: [blueprints]
      summary: Uninstall (admin, async task)
      parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
      responses:
        "202":
          description: Accepted, returns task_id
  /v1/tasks:
    get:
      tags: [tasks]
      summary: List tasks (newest first)
      responses:
        "200":
          description: Task list
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items: { $ref: "#/components/schemas/Task" }
  /v1/tasks/{id}:
    get:
      tags: [tasks]
      summary: Poll a task
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: Task state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
  /v1/services:
    get:
      tags: [services]
      summary: List services
      responses: { "200": { description: raw CLI output } }
    post:
      tags: [services]
      summary: Create a service (admin)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceCreate" }
      responses: { "201": { description: created } }
  /v1/services/{name}/scale:
    post:
      tags: [services]
      summary: Scale a service (admin)
      parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                replicas: { type: integer }
      responses: { "200": { description: scaled } }
  /v1/services/{name}:
    get:
      tags: [services]
      summary: Inspect a service
      parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: service } }
    delete:
      tags: [services]
      summary: Remove a service (admin)
      parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: removed } }
  /v1/functions:
    get:
      tags: [functions]
      summary: List functions
      responses: { "200": { description: raw CLI output } }
    post:
      tags: [functions]
      summary: Deploy a function (admin)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                image: { type: string }
      responses: { "201": { description: deployed } }
  /v1/functions/{name}/invoke:
    post:
      tags: [functions]
      summary: Invoke a function (admin)
      parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data: { type: string }
      responses: { "200": { description: invocation output } }
  /v1/functions/{name}:
    delete:
      tags: [functions]
      summary: Remove a function (admin)
      parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: removed } }
  /v1/containers/{id}/rename:
    post:
      tags: [containers]
      summary: Rename a container (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: name, in: query, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
      responses: { "200": { description: renamed } }
  /v1/containers/{id}/top:
    get:
      tags: [containers]
      summary: Process list inside a container
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: ps_args, in: query, schema: { type: string } }
      responses: { "200": { description: top } }
  /v1/containers/{id}/wait:
    post:
      tags: [containers]
      summary: Wait until the container stops (admin)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: exit status } }
  /v1/containers/{id}/changes:
    get:
      tags: [containers]
      summary: Filesystem changes of a container
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: changes } }
  /v1/containers/{id}/export:
    get:
      tags: [containers]
      summary: Export the container filesystem as tar
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: tar archive } }
  /v1/containers/{id}/commit:
    post:
      tags: [containers]
      summary: Create an image from a container (admin)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                repo: { type: string }
                tag: { type: string }
                ref: { type: string }
      responses: { "201": { description: committed } }
  /v1/containers/{id}/ports:
    get:
      tags: [containers]
      summary: Show port mappings
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: ports } }
  /v1/containers/{id}/ports/add:
    post:
      tags: [containers]
      summary: Add a port mapping without restart (admin)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mapping: { type: string }
      responses: { "200": { description: added } }
  /v1/containers/{id}/ports/remove:
    post:
      tags: [containers]
      summary: Remove a port mapping (admin)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mapping: { type: string }
      responses: { "200": { description: removed } }
  /v1/images/{ref}/history:
    get:
      tags: [images]
      summary: Image layer history
      parameters: [{ name: ref, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: history } }
  /v1/images/{ref}/get:
    get:
      tags: [images]
      summary: Download an image as tar
      parameters: [{ name: ref, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: tar archive } }
  /v1/images/{ref}/verify:
    post:
      tags: [images]
      summary: Verify image digests offline (admin)
      parameters: [{ name: ref, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: verification output } }
  /v1/system/df:
    get:
      tags: [system]
      summary: Disk usage by images, containers, volumes
      responses: { "200": { description: df output } }
  /v1/system/prune:
    post:
      tags: [system]
      summary: Remove unused containers and images (admin)
      responses: { "200": { description: pruned } }
  /v1/info:
    get:
      tags: [system]
      summary: Raw cardinal /info for a node
      parameters: [{ name: node, in: query, schema: { type: string } }]
      responses: { "200": { description: info } }
  /v1/services/{name}/update:
    post:
      tags: [services]
      summary: Update a service image/replicas (admin)
      parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                image: { type: string }
                replicas: { type: integer }
      responses: { "200": { description: updated } }
  /v1/cluster/health:
    get:
      tags: [cluster]
      summary: Cluster health
      responses: { "200": { description: health } }
  /v1/cluster/replicas:
    get:
      tags: [cluster]
      summary: Replica list
      responses: { "200": { description: replicas } }
    post:
      tags: [cluster]
      summary: Create a replica (admin)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [image]
              properties:
                service_name: { type: string }
                image: { type: string }
                replica_id: { type: string }
      responses: { "201": { description: created } }
  /v1/cluster/replicas/{id}:
    delete:
      tags: [cluster]
      summary: Remove a replica (admin)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: removed } }
  /v1/cluster/info:
    get:
      tags: [cluster]
      summary: Cluster overview (cardinal cluster info)
      responses: { "200": { description: info } }
  /v1/cluster/containers:
    get:
      tags: [cluster]
      summary: Containers across the cluster view
      responses: { "200": { description: containers } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Version:
      type: object
      properties:
        name: { type: string }
        version: { type: string }
        status: { type: string }
    Self:
      type: object
      properties:
        authenticated: { type: boolean }
        role: { type: string, enum: [readonly, admin] }
        admin: { type: boolean }
    Node:
      type: object
      properties:
        name: { type: string }
        url: { type: string }
        status: { type: string }
        local: { type: boolean }
        checked_at: { type: string }
    SystemInfo:
      type: object
      properties:
        nodes:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              status: { type: string }
              running: { type: integer }
              stopped: { type: integer }
              total: { type: integer }
              images: { type: integer }
              ncpu: { type: integer }
              mem_total_bytes: { type: integer }
        running: { type: integer }
        total: { type: integer }
    ContainerPage:
      type: object
      properties:
        containers: { type: array }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    CreateRequest:
      type: object
      required: [image]
      properties:
        image: { type: string }
        name: { type: string }
        ports: { type: array, items: { type: string } }
        env: { type: array, items: { type: string } }
        volumes: { type: array, items: { type: string } }
        restart: { type: string }
        memory: { type: string }
        cpus: { type: number }
        labels: { type: object, additionalProperties: { type: string } }
    ExecRequest:
      type: object
      required: [Cmd]
      properties:
        Cmd: { type: array, items: { type: string } }
        AttachStdin: { type: boolean }
        AttachStdout: { type: boolean }
        AttachStderr: { type: boolean }
        Tty: { type: boolean }
    Task:
      type: object
      properties:
        id: { type: string }
        kind: { type: string }
        status: { type: string, enum: [queued, running, succeeded, failed] }
        created_at: { type: string }
        started_at: { type: string }
        finished_at: { type: string }
        error: { type: string }
        output: { type: string }
        progress: { type: array, items: { type: string } }
    ServiceCreate:
      type: object
      required: [name, image]
      properties:
        name: { type: string }
        image: { type: string }
        replicas: { type: integer }
        ports: { type: array, items: { type: string } }
        env: { type: array, items: { type: string } }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }

name: build

# Build, test and publish cardinal-wings.
#
# Trigger matrix:
#   push (main)         → lint + test + build matrix, upload artefacts
#   pull_request        → lint + test + build only (cancel-in-progress)
#   tag v*              → everything + create a GitHub Release with the
#                         version stamped into the binaries
#   workflow_dispatch   → manual rerun
#
# The version embedded in the binary comes from the tag name: releases
# build with `-X internal/server.version=<tag>`, so `cardinal-wings
# /v1/version` reports the exact tagged release. Local/dev builds fall
# back to the `dev` default in internal/server.
#
# Action versions are pinned to a known-good major. Dependabot is asked
# to ignore major-bumps via .github/dependabot.yml.

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

# Serialise builds per-ref so two pushes cannot race on dist/; cancel
# superseded PR runs to save runner minutes.
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write   # release: write tag + assets

jobs:
  openapi-version:
    name: openapi version matches the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: a released tag must match docs/openapi.yaml info.version
        # info.version sat at "0.2.0-dev" while the project was on 0.5.x, so
        # anyone generating a panel client from this document read a version
        # that never existed. redocly lint only checks structure, so nothing
        # caught it. No-op on branch and PR pushes.
        run: |
          set -eu
          case "$GITHUB_REF_NAME" in
            v*) tag="${GITHUB_REF_NAME#v}" ;;
            *)
              echo "not a tag push ($GITHUB_REF_NAME) - nothing to compare"
              exit 0
              ;;
          esac
          spec=$(sed -n 's/^  version: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' docs/openapi.yaml | head -n1)
          echo "tag=$tag  openapi info.version=$spec"
          if [ "$tag" != "$spec" ]; then
            echo "::error file=docs/openapi.yaml::info.version $spec does not match tag $tag."
            echo "Update docs/openapi.yaml info.version before tagging."
            exit 1
          fi
          echo "openapi info.version matches tag"

  lint:
    name: gofmt / go vet / govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # 1.26.9 is the first release carrying the net/http, net/textproto and
          # crypto/tls fixes for GO-2026-6603/6605/6607/6608/6610/6611/6612/
          # 6613/6617. Keep every job on the same pinned version.
          go-version: "1.26.9"
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...

      # Without this the release binaries were linked against a standard
      # library with known CVEs and nothing noticed: wings had no vuln scan
      # at all.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # Секреты в репозитории — самая дорогая находка аудита: токен ноды
      # и панели попадают в бэкапы и архивы, .gitignore их не спасает.
      - name: checkout full history (for the secret scan)
        # Полная история обязательна: в shallow-клоне `git log -p -1`
        # показывает всё дерево как только что добавленное, и примеры в
        # документации ловятся как секреты. С историей diff настоящий.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: OpenAPI lint
        run: |
          npx --yes @redocly/cli lint docs/openapi.yaml

  test:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
          cache: true
      - name: go test
        run: go test -race ./...

  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, test, openapi-version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
          cache: true

      - name: Set version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ] && echo "${{ github.ref }}" | grep -q '^refs/tags/'; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: |
          out="cardinal-wings-${{ matrix.goos }}-${{ matrix.goarch }}"
          CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -buildid= -X github.com/animesao/cardinal-wings/internal/server.version=${{ steps.version.outputs.tag }}" \
            -o "dist/$out" .
          # Сумма в стандартном формате sha256sum: "<hash>  <имя файла>".
          # Раньше здесь писалось "<hash>  dist/<имя>", и проверка
          # "sha256sum -c" / grep по имени файла не срабатывала ни у кого.
          ( cd dist && sha256sum "$out" > "$out.sha256" )
          echo "built dist/$out (${{ steps.version.outputs.tag }})"

      # Attach the installer once (amd64 row only) so the merged artifacts
      # directory doesn't contain two copies that collide on download.
      - name: Commit the installer for release builds only
        if: startsWith(github.ref, 'refs/tags/v') && matrix.goarch == 'amd64'
        run: |
          cp install.sh dist/install.sh
          chmod +x dist/install.sh
          ( cd dist && sha256sum install.sh > install.sh.sha256 )

      - uses: actions/upload-artifact@v4
        with:
          name: cardinal-wings-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags: the release-notes step diffs against the
          # previous tag (shallow checkouts have neither).
          fetch-depth: 0

      - name: Download all release artefacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Inspect artefacts
        run: ls -la artifacts/

      - name: Build release notes
        id: notes
        run: |
          CUR="${{ github.ref_name }}"
          # Previous release tag by creation date.
          PREV=$(git tag --sort=-creatordate | grep -v "^${CUR}$" | head -1)
          if [ -z "$PREV" ]; then
            RANGE="$CUR"
            TITLE="Initial release"
          else
            RANGE="$PREV..$CUR"
            TITLE="Changes since $PREV (last 10 commits)"
          fi
          {
            echo "## $TITLE"
            echo ""
            git log --pretty=format:'- %h %s' "$RANGE" | head -10
            echo ""
            echo ""
            cat .github/release-body.md
            if [ -n "$PREV" ]; then
              echo ""
              echo "Full Changelog: $PREV...$CUR"
            fi
          } > /tmp/release-body.md
          cat /tmp/release-body.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: cardinal-wings ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: /tmp/release-body.md
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
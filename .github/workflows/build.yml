name: build

# Build, test and publish cardinal-wings.
#
# Trigger matrix:
#   push (main)         → lint + test + build matrix, upload artefacts
#   pull_request        → lint + test + build only (cancel-in-progress)
#   tag v*              → everything + create a GitHub Release with the
#                         version stamped into the binaries
#   workflow_dispatch   → manual rerun
#
# The version embedded in the binary comes from the tag name: releases
# build with `-X internal/server.version=<tag>`, so `cardinal-wings
# /v1/version` reports the exact tagged release. Local/dev builds fall
# back to the `dev` default in internal/server.
#
# Action versions are pinned to a known-good major. Dependabot is asked
# to ignore major-bumps via .github/dependabot.yml.

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

# Serialise builds per-ref so two pushes cannot race on dist/; cancel
# superseded PR runs to save runner minutes.
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write   # release: write tag + assets

jobs:
  lint:
    name: gofmt / go vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...

      - name: OpenAPI lint
        run: |
          npx --yes @redocly/cli lint docs/openapi.yaml

  test:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: true
      - name: go test
        run: go test -race ./...

  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: true

      - name: Set version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ] && echo "${{ github.ref }}" | grep -q '^refs/tags/'; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: |
          out="cardinal-wings-${{ matrix.goos }}-${{ matrix.goarch }}"
          CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -buildid= -X github.com/animesao/cardinal-wings/internal/server.version=${{ steps.version.outputs.tag }}" \
            -o "dist/$out" .
          sha256sum "dist/$out" > "dist/$out.sha256"
          echo "built dist/$out (${{ steps.version.outputs.tag }})"

      # Attach the installer once (amd64 row only) so the merged artifacts
      # directory doesn't contain two copies that collide on download.
      - name: Commit the installer for release builds only
        if: startsWith(github.ref, 'refs/tags/v') && matrix.goarch == 'amd64'
        run: |
          cp install.sh dist/install.sh
          chmod +x dist/install.sh
          sha256sum dist/install.sh > dist/install.sh.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: cardinal-wings-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Download all release artefacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Inspect artefacts
        run: ls -la artifacts/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: cardinal-wings ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: .github/release-body.md
          generate_release_notes: true
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}